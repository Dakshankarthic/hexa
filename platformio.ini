; =============================================================================
; ESP32 Hexapod - PlatformIO Project Configuration
; Board: ESP32 DevKit (30-pin) + 2x PCA9685 + 18x 180° Servos + Bluetooth
; =============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200
upload_speed  = 115200

; Library dependencies
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
    adafruit/Adafruit BusIO @ ^1.14.5

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_BT_ENABLED
